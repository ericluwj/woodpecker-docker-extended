name: Publish agent image
on:
  workflow_dispatch:
concurrency:
  group: publish-agent-image
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l backend cmd)"
      - run: make test vet build
      - run: DOCKER_EXTENDED_INTEGRATION=1 DOCKER_EXTENDED_TEST_REGISTRY_MIRRORS='{"docker.io":"mirror.gcr.io"}' go test -race -tags=integration -run TestIntegrationWorkflow -timeout=10m -v ./backend/dockerextended
      - uses: docker/setup-buildx-action@v3
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: woodpecker-docker-extended:verify
          build-args: |
            VERSION=0.1.0
            COMMIT=${{ github.sha }}
      - name: Verify image startup
        run: docker run --rm woodpecker-docker-extended:verify --version
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        uses: docker/metadata-action@v5
        id: metadata
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/woodpecker-docker-extended
            ghcr.io/ericluwj/woodpecker-docker-extended
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=0.1.0
            COMMIT=${{ github.sha }}
      - name: Record immutable deployment references
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          printf 'Docker Hub: `docker.io/%s/woodpecker-docker-extended@%s`\n' "$DOCKERHUB_USERNAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'GHCR: `ghcr.io/ericluwj/woodpecker-docker-extended@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
